[package]
name = "hitecdpc-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for Hitec DPC digital servo programmers"

[[bin]]
name = "hitecdpc"
path = "src/main.rs"

[dependencies]
hitecdpc = { path = "../hitecdpc" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
