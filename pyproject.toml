[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hitecdpc"
version = "0.1.0"
description = "Cross-platform Python library for Hitec DPC digital servo programmers"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hitecdpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
